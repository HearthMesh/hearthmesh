services:
  node-a:
    build: .
    command: ["serve", "-data", "/data", "-listen", ":8080", "-peers", "http://node-b:8080,http://node-c:8080"]
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["node-a:/data"]
  node-b:
    build: .
    command: ["serve", "-data", "/data", "-listen", ":8080", "-peers", "http://node-a:8080,http://node-c:8080"]
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["node-b:/data"]
  node-c:
    build: .
    command: ["serve", "-data", "/data", "-listen", ":8080", "-peers", "http://node-a:8080,http://node-b:8080"]
    ports: ["127.0.0.1:8083:8080"]
    volumes: ["node-c:/data"]
volumes:
  node-a:
  node-b:
  node-c:
